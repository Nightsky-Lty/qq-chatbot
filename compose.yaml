name: qq-chatbot

services:
  bot:
    build:
      context: .
      args:
        # 国内服务器默认使用PyPI镜像；可在.env中覆盖或改回https://pypi.org/simple。
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://mirrors.aliyun.com/pypi/simple}
    restart: unless-stopped
    init: true
    # 普通配置随 Git 更新；密钥和部署身份只从本地 .env 注入。
    env_file:
      - config.env
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请先在 .env 中填写 DeepSeek API Key}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:?请先在 .env 中填写 OneBot Token}
      ADMIN_QQ_IDS: ${ADMIN_QQ_IDS:-}
      STICKER_LLM_API_KEY: ${STICKER_LLM_API_KEY:-}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
      IMAGE_LLM_API_KEY: ${IMAGE_LLM_API_KEY:-}
      # 固定写入挂载目录，避免 .env 中的相对路径将数据库写进临时文件系统。
      DATABASE_PATH: /app/data/bot.db
      IMAGE_CACHE_DIRECTORY: /app/data/image_cache
      STICKER_DIRECTORY: /app/app/sticker_images
      # 收藏目录位于已有持久数据卷中，不写入只读的人工图库。
      STICKER_COLLECTED_DIRECTORY: /app/data/collected_stickers
    ports:
      # 健康检查仅供服务器本机访问，NapCat 使用容器内网连接。
      - "127.0.0.1:8080:8080"
    volumes:
      - bot-data:/app/data
      # 只读四个宿主机统计文件；不挂载整个/proc、宿主机根目录或Docker socket。
      - type: bind
        source: /proc/stat
        target: /host/proc/stat
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /proc/meminfo
        target: /host/proc/meminfo
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /proc/loadavg
        target: /host/proc/loadavg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /proc/uptime
        target: /host/proc/uptime
        read_only: true
        bind:
          create_host_path: false
      - ./app/sticker_images:/app/app/sticker_images:ro
      # 模型文件较大且不进入镜像/Git；在宿主机导出后只读挂载。
      - ${EMBEDDING_MODEL_DIR:-./models/bge-small-zh-v1.5-int8}:/app/models/bge-small-zh-v1.5:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy
    environment:
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:?请先在 .env 中设置 NapCat 管理页面密码}
      MODE: reverse_ws
      # Token 推荐使用随机十六进制字符，避免 URL 特殊字符需要转义。
      ONEBOT_URL: ws://bot:8080/onebot/v11/ws?access_token=${ONEBOT_ACCESS_TOKEN:?请先设置 OneBot Token}
    ports:
      # 在电脑上通过 SSH 转发访问管理页，无需开放 6099 公网端口。
      - "127.0.0.1:6099:6099"
    volumes:
      - qq-data:/app/.config/QQ
      - napcat-config:/app/napcat/config
      - napcat-plugins:/app/napcat/plugins
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 普通容器重建保留这些数据。不要使用 docker compose down -v 删除数据卷。
volumes:
  bot-data:
  qq-data:
  napcat-config:
  napcat-plugins:
